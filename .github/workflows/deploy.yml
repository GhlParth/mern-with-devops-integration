name: Deploy App to AWS ASG

on:
  # Automatically runs after build.yml completes successfully
  workflow_run:
    workflows: ["Build and Push Images to GHCR"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1   # ← Fixed: matches terraform.tfvars aws_region

      - name: Update SSM Database URI
        run: |
          aws ssm put-parameter \
            --name "/taskflow/mongodb_uri" \
            --value "${{ secrets.MONGODB_URI }}" \
            --type "SecureString" \
            --overwrite

      - name: Update SSM GitHub Token
        run: |
          aws ssm put-parameter \
            --name "/taskflow/github_token" \
            --value "${{ secrets.GITHUB_TOKEN }}" \
            --type "SecureString" \
            --overwrite

      - name: Trigger Frontend ASG Instance Refresh
        run: |
          # ASG name = project_name (taskflow-mern) + "-frontend-asg"
          FRONTEND_ASG="taskflow-mern-frontend-asg"

          echo "Starting instance refresh for $FRONTEND_ASG..."

          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$FRONTEND_ASG" \
            --preferences '{"MinHealthyPercentage": 50}'

          echo "Frontend instance refresh triggered successfully!"

      - name: Trigger Backend ASG Instance Refresh
        run: |
          # ASG name = project_name (taskflow-mern) + "-backend-asg"
          BACKEND_ASG="taskflow-mern-backend-asg"

          echo "Starting instance refresh for $BACKEND_ASG..."

          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$BACKEND_ASG" \
            --preferences '{"MinHealthyPercentage": 50}'

          echo "Backend instance refresh triggered successfully!"
