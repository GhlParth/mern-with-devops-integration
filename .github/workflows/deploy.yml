name: Deploy App to AWS ASG

on:
  # Automatically runs after build.yml completes successfully
  workflow_run:
    workflows: ["Build and Push Images to GHCR"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1   # ← Fixed: matches terraform.tfvars aws_region

      - name: Update SSM Database URI
        run: |
          aws ssm put-parameter \
            --name "/taskflow/mongodb_uri" \
            --value "${{ secrets.MONGODB_URI }}" \
            --type "SecureString" \
            --overwrite

      - name: Update SSM GitHub Token
        run: |
          aws ssm put-parameter \
            --name "/taskflow/github_token" \
            --value "${{ secrets.GITHUB_TOKEN }}" \
            --type "SecureString" \
            --overwrite

      - name: Trigger Frontend ASG Instance Refresh
        run: |
          FRONTEND_ASG="taskflow-mern-frontend-asg"
          
          echo "Checking refresh status for $FRONTEND_ASG..."
          STATUS=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "$FRONTEND_ASG" \
            --query "InstanceRefreshes[0].Status" --output text)
          
          if [ "$STATUS" == "InProgress" ]; then
            echo "A refresh is already InProgress for $FRONTEND_ASG. The current refresh will pick up the new images. Skipping trigger..."
          else
            echo "Starting new instance refresh for $FRONTEND_ASG..."
            aws autoscaling start-instance-refresh \
              --auto-scaling-group-name "$FRONTEND_ASG" \
              --preferences '{"MinHealthyPercentage": 50}'
          fi
          echo "Frontend deployment logic completed!"

      - name: Trigger Backend ASG Instance Refresh
        run: |
          BACKEND_ASG="taskflow-mern-backend-asg"
          
          echo "Checking refresh status for $BACKEND_ASG..."
          STATUS=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "$BACKEND_ASG" \
            --query "InstanceRefreshes[0].Status" --output text)
          
          if [ "$STATUS" == "InProgress" ]; then
            echo "A refresh is already InProgress for $BACKEND_ASG. Skipping trigger..."
          else
            echo "Starting new instance refresh for $BACKEND_ASG..."
            aws autoscaling start-instance-refresh \
              --auto-scaling-group-name "$BACKEND_ASG" \
              --preferences '{"MinHealthyPercentage": 50}'
          fi
          echo "Backend deployment logic completed!"
